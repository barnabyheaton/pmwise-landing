name: Secret scan

# Looks through every commit for passwords, keys and tokens saved into the code by mistake.
# Our own free check, because GitHub's Secret Protection is a paid feature on private
# repositories (4 Oct 2026). ISM self-assessment and cyber-security-radar.md §5, Lane B.
# A finding fails the run; a false alarm goes in .gitleaks.toml with the reason.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 20 * * 0" # weekly, Monday morning in Australia, so new detection rules see old history

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, not just the latest commit
      - name: Scan every commit
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --no-banner --redact --verbose
